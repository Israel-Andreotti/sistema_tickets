{% extends "tickets/base.html" %}

{% block title %}Novo equipamento — Chamados de TI{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <a href="{% url 'tickets:listar_equipamentos' %}" class="link-secondary small">&larr; Voltar para equipamentos</a>

        <div class="card shadow-sm mt-2">
            <div class="card-body">
                <h1 class="h4 card-title mb-3">Cadastrar equipamento</h1>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include "tickets/_campos_equipamento.html" %}
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
