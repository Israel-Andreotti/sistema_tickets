{% load static %}<!doctype html>
<html lang="pt-br">
<head>
    <script src="{% static 'tickets/js/tema-inicial.js' %}"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro ao processar sua solicitação — Chamados de TI</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'tickets/css/base.css' %}">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .erro-codigo { font-size: 4rem; font-weight: 700; color: var(--brand); line-height: 1; }
    </style>
</head>
<body>
    <div class="text-center" style="max-width: 460px;">
        <img src="{% static 'tickets/img/logo-full.png' %}" alt="Hospital Central São Lucas" style="max-width: 200px; width: 100%; height: auto;" class="mb-4">
        <div class="erro-codigo mb-2">Ops!</div>
        <h1 class="h4 mb-3">Não foi possível processar sua solicitação</h1>
        <p class="text-muted mb-4">
            Algo deu errado ao carregar essa página. Tente novamente em instantes; se o
            problema continuar, procure a equipe de TI.
        </p>
        <a href="{% url 'tickets:portal' %}" class="btn btn-primary">Voltar ao início</a>
    </div>
</body>
</html>
